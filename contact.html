<div class="form-container">
  <form id="contact-form">
    <header>
      <h1>REACH OUT</h1>
    </header>

    <div>
      <label for="name">Name</label>
      <input id="name" name="fi-sender-firstName" minlength="3" maxlength="50" type="text" placeholder="Your name..." required>
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" name="fi-sender-email" type="email" placeholder="Your email..." required>
    </div>

    <div class="select-box">
      <label for="service">Service</label>
      <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option value="branding">Branding</option>
        <option value="web-design">Web Design</option>
        <option value="video-editing">Video Editing</option>
        <option value="drawing-illustration">Drawing & Illustration</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div>
      <label for="message">Message <span class="indicator">(50-500 characters)</span></label>
      <textarea id="message" name="fi-text-message" minlength="50" maxlength="500" rows="5" placeholder="Your request..." required></textarea>
    </div>

    <!-- Forminit required hidden fields -->
    <input type="hidden" name="formId" value="qwwr4n2tj40">
    <input type="hidden" name="redirect" value=""> <!-- leave blank to stay on page -->
    <input type="hidden" name="subject" value="New contact from website">
    <input type="hidden" name="from" value="{{email}}">

    <div id="error" role="alert" style="display:none;"></div>
    <div id="success" role="status" style="color:#0a6f2e;display:none;"></div>


    <button type="submit" id="submit" class="submit-button">Send message</button>
    <p id="form-status"></p>
  </form>
</div>

<!-- Forminit SDK -->
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>

  <script>
    const forminit = new Forminit();
    const FORM_ID = 'qwwr4n2tj40'; // Your Form ID

    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const button = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      // Show loading state
      status.textContent = 'Sending your message...';
      status.className = 'status-loading show';
      button.disabled = true;
      button.textContent = 'Sending...';

      const formData = new FormData(form);

      try {
        const { data, error } = await forminit.submit(FORM_ID, formData);

        button.disabled = false;
        button.textContent = 'Send Message';

        if (error) {
          status.textContent = `Error: ${error.message}`;
          status.className = 'status-error show';
          return;
        }

        // Success
        status.textContent =
          '✓ Message sent successfully. Thank you for choosing Afonso Design!';
        status.className = 'status-success show';
        form.reset();

        // Optional: Clear success message after 5 seconds
        setTimeout(() => {
          status.className = 'show';
          status.textContent = '';
        }, 5000);
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.className = 'status-error show';
        button.disabled = false;
        button.textContent = 'Send Message';
      }
    });
  </script>
